      /* Colours of the page canvas and the startup screen. color-scheme follows the system until the app
         sets the chosen theme on <html> (src/theme/theme.tsx); light-dark() then follows that choice too.
         The media query serves browsers without light-dark(). */
      :root { color-scheme: light dark; --numa-canvas: #ffffff; --numa-ink: #0B0B0C; --numa-on-ink: #F4F4F1; --numa-muted: #61646A; }

      html, body { height: 100%; background: var(--numa-canvas); }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }

    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; }
      #root { display: flex; flex: 1; }
      #numa-startup { box-sizing: border-box; position: fixed; inset: 0; overflow: auto; background: var(--numa-canvas); color: var(--numa-ink); font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; padding: 32px 24px; z-index: 9999; }
      #numa-startup section { max-width: 420px; margin: 8vh auto; }
      #numa-startup .mark { font-family: system-ui, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.03em; }
      #numa-startup .pro { display: inline-block; margin-left: 8px; padding: 2px 6px; border-radius: 6px; background: var(--numa-ink); color: var(--numa-on-ink); font-size: 12px; letter-spacing: 0.06em; vertical-align: 4px; }
      #numa-startup h1 { font-family: system-ui, sans-serif; font-weight: 300; font-size: 54px; line-height: 1; letter-spacing: -0.02em; margin: 24px 0 16px; }
      #numa-startup a { color: inherit; display: inline-flex; align-items: center; min-height: 44px; margin-right: 16px; }
      #numa-startup a:focus-visible { outline: 2px solid var(--numa-ink); outline-offset: 3px; }
      #numa-startup small { display: block; color: var(--numa-muted); }
    </style>
  </head>
  <body>
    <noscript>Numa Pro needs JavaScript.</noscript>
    <div id="root"></div>
    <main id="numa-startup">
      <section>

      </section>
    </main>
