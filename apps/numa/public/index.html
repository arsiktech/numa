<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Numa Pro</title>
    <meta name="description" content="Your net worth, live: what you own, what you owe and how it moves." />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-title" content="Numa Pro" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The react-native-web style reset, plus a background that matches the theme before the app loads. -->
    <style id="expo-reset">
      html, body { height: 100%; background: #ffffff; }
      @media (prefers-color-scheme: dark) { html, body { background: #000000; } }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Numa Pro needs JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
