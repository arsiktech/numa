# Walks the demo portfolio on an iOS simulator and takes a screenshot of each place.
# Run by .github/workflows/ios-sim.yml. SHOT is a prefix such as "dark" or "light".
appId: com.arsiktech.numa
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "What you own.*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-01-home
# Center the actual tip action before tapping: large text can place it behind the fixed bars.
# A missed dismissal must fail here, not open Ask and scroll the wrong screen.
- runFlow:
    when:
      visible: "Drag the line to go back in time"
    commands:
      - scrollUntilVisible:
          element:
            id: "coach-tip-dismiss"
          direction: DOWN
          centerElement: true
          timeout: 30000
      - takeScreenshot: ${SHOT}-01a-tip-action
      - tapOn:
          id: "coach-tip-dismiss"
      - assertNotVisible:
          id: "coach-tip"
      - assertNotVisible:
          id: "ask-input"
- scrollUntilVisible:
    element: "Needs you.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${SHOT}-02-home-scrolled
# iOS shrinks the tab bar while scrolling down; scrolling back up usually brings the tabs back.
- scrollUntilVisible:
    element:
      id: "tab-flow"
    direction: UP
    timeout: 30000
    optional: true
# When the bar stays shrunk at the top, tapping it (the Home tab's icon) opens it again.
- runFlow:
    when:
      notVisible:
        id: "tab-flow"
    commands:
      - tapOn:
          id: "chart.line.uptrend.xyaxis"
      - waitForAnimationToEnd
- tapOn:
    id: "tab-flow"
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-03-flow
- tapOn:
    id: "tab-plan"
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-04-plan
- tapOn:
    id: "tab-home"
- tapOn:
    id: "ask-or-add"
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-05-ask
# With the keyboard up, the Ask box must sit fully above it (Ask opens as a sheet).
- tapOn:
    id: "ask-input"
- waitForAnimationToEnd
# A fresh simulator shows the one-time swipe-typing tip over the keyboard; close it first.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- inputText: "Coffee 4.50"
- takeScreenshot: ${SHOT}-06-ask-keyboard
# Reopen Ask: the keyboard can now come up with the sheet itself, before anything is tapped.
- tapOn: "Close"
- waitForAnimationToEnd
- tapOn:
    id: "ask-or-add"
- waitForAnimationToEnd
- inputText: "Lunch 12"
- takeScreenshot: ${SHOT}-07-ask-reopened
