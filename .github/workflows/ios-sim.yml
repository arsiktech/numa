name: iOS simulator

# Builds the app for the iOS simulator, walks the demo portfolio with Maestro and
# keeps dark-mode screenshots on pull requests. Main and manual runs also check
# light mode and the largest accessibility text size. No account, backend or signing
# is involved: without a Convex URL the app opens straight into the demo.
#
# The compiled app is cached by its native fingerprint (the same hash that decides
# whether a change ships over the air or needs a store build). When only app code
# changed, the cached app gets a freshly built Hermes bundle instead of a 20-minute
# Xcode build; the walk itself is the same either way. Runs on main keep the cache
# warm for pull requests.
on:
  pull_request:
    paths:
      - 'apps/numa/**'
      - '.github/workflows/ios-sim.yml'
  push:
    branches: [main]
    paths:
      - 'apps/numa/**'
      - '.github/workflows/ios-sim.yml'
  workflow_dispatch:

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    # A cache miss means a full Xcode build (about 25 minutes) plus the walk.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/numa
    env:
      PRODUCTS: build/Build/Products/Release-iphonesimulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/numa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Native fingerprint
        run: |
          FP=$(npx @expo/fingerprint fingerprint:generate --platform ios | python3 -c "import json, sys; print(json.load(sys.stdin)['hash'])")
          echo "FP=$FP" >> "$GITHUB_ENV"
          echo "iOS fingerprint: $FP"

      - name: Reuse the app built for this fingerprint
        id: app
        uses: actions/cache@v4
        with:
          path: apps/numa/build/Build/Products/Release-iphonesimulator
          key: ios-sim-app-v1-${{ env.FP }}

      - name: Generate the iOS project
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          npx expo prebuild --platform ios --clean
          # Over-the-air updates stay off in CI, so the walk always runs the code under test.
          plutil -replace EXUpdatesEnabled -bool NO ios/*/Supporting/Expo.plist

      - name: Build for the simulator
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -quiet
          ls "$PRODUCTS"

      # Same command the Xcode build phase runs: a Hermes bytecode bundle and its assets.
      - name: Bundle this commit's app code into the cached app
        if: steps.app.outputs.cache-hit == 'true'
        run: |
          APP=$(ls -d "$PRODUCTS"/*.app | head -1)
          ENTRY=$(node -e "require('expo/scripts/resolveAppEntry')" "$PWD" ios absolute | tail -1)
          npx expo export:embed --platform ios --dev false --reset-cache --entry-file "$ENTRY" \
            --bundle-output "$APP/main.jsbundle" --assets-dest "$APP" --bytecode

      # Booting only after the build: booting during it slowed the Xcode build from 22 to 43 minutes.
      - name: Boot an iPhone simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = [d for r, ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds]
          pro = [d for d in devs if d['name'].startswith('iPhone') and 'Pro' in d['name'] and 'Max' not in d['name']]
          print((pro or [d for d in devs if d['name'].startswith('iPhone')])[-1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices booted
          APP=$(ls -d "$PRODUCTS"/*.app | head -1)
          xcrun simctl install "$UDID" "$APP"

      - name: Install Maestro
        working-directory: .
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: ${{ github.event_name == 'pull_request' && 'Walk the app (dark smoke)' || 'Walk the app (dark, light, largest text)' }}
        env:
          FULL_WALK: ${{ github.event_name != 'pull_request' }}
          # The first start on a fresh simulator installs Maestro's XCTest driver, which can
          # take longer than the 2-minute default on hosted runners.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: |
          mkdir -p shots
          FAIL=0
          walk() { maestro --device "$UDID" test -e SHOT="$1" --test-output-dir "shots/$1-run" .maestro/tour.yaml || FAIL=1; }
          xcrun simctl ui "$UDID" content_size large
          xcrun simctl ui "$UDID" appearance dark; walk dark
          if [ "$FULL_WALK" = "true" ]; then
            xcrun simctl ui "$UDID" appearance light; walk light
            xcrun simctl ui "$UDID" appearance dark
            xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large; walk bigtext
          fi
          mv ./*.png shots/ 2>/dev/null || true
          ls shots
          exit $FAIL

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screens
          path: |
            apps/numa/shots/
            apps/numa/*.png
          retention-days: 14
