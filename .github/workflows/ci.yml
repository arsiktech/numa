name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - numa-v2
      - codex/**

jobs:
  verify:
    runs-on: ubuntu-latest
    # The public Playwright smoke boots `npm run dev`, and the app renders a
    # "cloud configuration required" screen (not the welcome page) without a
    # Convex URL. VITE_CONVEX_URL is a public client value (it ships in the
    # bundle), so the dev URL lives in repo variables, not secrets. Falls back
    # to the dev deployment so forks without the vars still build.
    env:
      VITE_NUMA_CLOUD_AUTH: "1"
      VITE_CONVEX_URL: ${{ vars.NUMA_DEV_CONVEX_URL || 'https://rosy-mink-170.eu-west-1.convex.cloud' }}
      VITE_CONVEX_SITE_URL: ${{ vars.NUMA_DEV_CONVEX_SITE_URL || 'https://rosy-mink-170.eu-west-1.convex.site' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle

      - name: Unit tests
        run: npm run test

      - name: Browser tests
        run: npm run test:ui

      - name: Release dependency audit
        run: npm run audit:release

      - name: All-dependency maintenance audit
        continue-on-error: true
        run: npm run audit:all

  # The rebuild app (Expo: iOS, Android and web from one codebase) has its own toolchain.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/numa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/numa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Web build
        run: npm run export:web

  # Scripted user journeys for the rebuild app's web build, against a throwaway
  # local Convex backend that exists only inside this job. Identities are
  # disposable @example.com accounts; no shared or production deployment is touched.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/numa/package-lock.json

      - name: Install dependencies
        run: npm ci && npm ci --prefix apps/numa

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start a local Convex backend
        run: |
          CONVEX_AGENT_MODE=anonymous npx convex dev --typecheck disable --tail-logs disable > "$RUNNER_TEMP/convex.log" 2>&1 &
          for i in $(seq 1 120); do
            grep -q "Convex functions ready" "$RUNNER_TEMP/convex.log" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/convex.log"
          exit 1

      - name: Give it Convex Auth keys
        run: node apps/numa/e2e/setup-auth.mjs

      - name: Build and serve the web app
        working-directory: apps/numa
        run: |
          EXPO_PUBLIC_CONVEX_URL=http://127.0.0.1:3210 npm run export:web
          npx -y serve@14.2.4 -s -l 5196 dist > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5196/ > /dev/null && exit 0; sleep 1; done
          exit 1

      - name: Run journeys
        run: node apps/numa/e2e/run.cjs

      - name: Keep screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            apps/numa/e2e/output/
            ${{ runner.temp }}/convex.log
          retention-days: 7
