    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Live value managed by syncBrowserChrome() (src/lib/theme.ts) to match
         the active palette canvas; this static default covers first paint. -->
    <meta name="theme-color" content="#fbfaf3" />
    <!-- A money app is full of numbers — never let iOS style them as phone links. -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Understand your spending, save toward a goal, and keep your assets and debts in one place." />
    <title>Numa Pro — Track money.</title>

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- PWA / iOS home screen -->

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Font CSS loads async: media="print" keeps it off the first-paint
         critical path and src/lib/fontCss.ts flips media to "all" at boot
         (no inline handlers, so CSP script-src can stay 'self'). Every face
         uses font-display: swap, so text renders in the system fallback
         immediately and upgrades when the webfont arrives. -->
    <link rel="preconnect" href="https://rsms.me/" />
    <link
      rel="stylesheet"
      href="https://rsms.me/inter/inter.css"
      media="print"
      data-numa-font-css
    />

    <!-- Palette themes use their own typographic stacks (DM Sans for Citrus,
         Inter Tight for Pebble, Newsreader for Coral, Geist for Carbon). Load
         the family the theme actually needs; Inter above is the global fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      media="print"
      data-numa-font-css
    />
    <noscript>
      <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
